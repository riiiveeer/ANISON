name: Bug 报告
description: 报告可以稳定复现的功能或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。不要提交 API Key、Cookie、私人歌词或包含敏感信息的数据备份。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 设置页版本、GitHub Release 或 git commit SHA
      placeholder: 例如 main@abcdef1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、设备和屏幕尺寸
      placeholder: Windows 11 / Chrome / 390×844
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: 运行方式
      options:
        - npm run dev（本机）
        - npm run dev:lan（局域网手机）
        - npm run preview:lan（构建预览）
        - 公网部署
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最短、稳定的操作步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可公开的错误文字、截图或其他线索
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认反馈中不包含 API Key、Cookie、私人歌词或其他敏感信息
          required: true
