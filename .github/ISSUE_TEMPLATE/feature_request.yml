name: 功能建议
description: 说明希望改善的使用场景和预期价值
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前不便
      description: 请先描述真实使用场景，而不只是功能名称
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明理想流程和主要交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式
  - type: dropdown
    id: priority
    attributes:
      label: 影响频率
      options:
        - 每次学习都会遇到
        - 每周会遇到
        - 偶尔遇到
        - 尚未实际使用
    validations:
      required: true
