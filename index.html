<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c44f4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ANISON - 日语歌曲辅助练习</title>
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="brand-block">
        <h1>🎵 ANISON</h1>
        <span class="subtitle">用喜欢的歌词记住日语</span>
      </div>
      <button class="header-action hidden" id="header-library-button" type="button">曲库</button>
    </header>

    <section class="pwa-status-region" id="pwa-status-region" aria-live="polite"></section>

    <section class="app-alert hidden" id="app-status-pill" aria-live="assertive">
      <span id="app-status-message"></span>
      <span class="alert-actions">
        <button class="alert-retry hidden" id="retry-status-button" type="button">刷新重试</button>
        <button id="dismiss-status-button" type="button" aria-label="关闭提示">×</button>
      </span>
    </section>

    <main id="page-root" class="page-root" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-btn active" data-route="home" type="button">首页</button>
      <button class="nav-btn" data-route="library" type="button">曲库</button>
      <button class="nav-btn" data-route="review" type="button">复习</button>
      <button class="nav-btn" data-route="settings" type="button">设置</button>
    </nav>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
